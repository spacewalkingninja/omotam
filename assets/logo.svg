<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-label="Omotam">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cable" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="560" height="300" rx="26" fill="#0b0e14"/>

  <g filter="url(#glow)" fill="none" stroke-linecap="round">
    <circle cx="170" cy="118" r="60" stroke="#22d3ee" stroke-width="9" opacity="0.95"/>
    <circle cx="136" cy="188" r="60" stroke="#e879f9" stroke-width="9" opacity="0.95"/>
    <circle cx="206" cy="188" r="60" stroke="#a3e635" stroke-width="9" opacity="0.95"/>
    <path d="M170 118 C 120 150, 150 230, 206 188" stroke="url(#cable)" stroke-width="4" opacity="0.85"/>
    <path d="M136 188 C 160 120, 220 130, 170 118" stroke="url(#cable)" stroke-width="4" opacity="0.85"/>
  </g>

  <g fill="#0b0e14" stroke-linecap="round">
    <circle cx="170" cy="118" r="13" fill="#22d3ee"/>
    <circle cx="136" cy="188" r="13" fill="#e879f9"/>
    <circle cx="206" cy="188" r="13" fill="#a3e635"/>
  </g>

  <text x="300" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="60"
        font-weight="700" fill="#e6e9ef" letter-spacing="1" filter="url(#glow)">Omotam</text>
  <text x="302" y="200" font-family="Consolas, monospace" font-size="15"
        fill="#64748b" letter-spacing="6">K N O T &#160;&#183;&#160; N E T</text>
</svg>
